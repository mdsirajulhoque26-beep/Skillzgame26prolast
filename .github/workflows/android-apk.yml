name: Build Skillzgame APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "APK version name"
        required: true
        default: "1.0.0"
      version_code:
        description: "APK version code"
        required: true
        default: "1"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        working-directory: android
        run: |
          gradle :app:assembleRelease \
            -PWEB_APP_URL="$WEB_APP_URL" \
            -PVERSION_NAME="${{ inputs.version_name }}" \
            -PVERSION_CODE="${{ inputs.version_code }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skillzgame-${{ inputs.version_name }}-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
